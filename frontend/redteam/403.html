<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>403 - Bị chặn</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            background: #1e293b;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
        }

        h1 {
            font-size: 72px;
            color: #ef4444;
            margin-bottom: 10px;
        }

        h2 {
            margin-bottom: 20px;
        }

        p {
            color: #cbd5f5;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: #ef4444;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #dc2626;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>403</h1>
    <h2>ACCESS DENIED</h2>
    <p>Bạn đã bị hệ thống phát hiện hành vi đáng ngờ và bị chặn.</p>

    <button onclick="goBack()">Quay lại</button>
</div>

<script>
    function goBack() {
        window.history.back();
    }
</script>

</body>
</html>
