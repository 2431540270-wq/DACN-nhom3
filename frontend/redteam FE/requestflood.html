<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Flood Attack</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">Attack Tool</div>
        <ul class="nav-links">
            <li><a href="reddash.html">Giới thiệu về tool</a></li>
            <li><a href="bruteforce.html">Brute Force Attack</a></li>
            <li><a href="requestflood.html" class="active">Request Flood Attack</a></li>
        </ul>
        <div style="margin-top:auto; padding:20px; font-size:0.8rem;">
            Web tool demo
        </div>
    </div>

    <!-- Main -->
    <div class="main-content">
        <header>
            <h1>Request Flood Attack</h1>
        </header>

        <div class="attack-container">
            <button onclick="attackOnce()">Gửi 1 request</button>
            <button onclick="attackLoop()">Flood liên tục</button>
            <button onclick="stopAttack()">Dừng</button>

            <div id="logBox" class="log-box">
                <p>Log sẽ hiển thị tại đây...</p>
            </div>
        </div>
    </div>

    <script>
        let interval;

        function addLog(text) {
            const box = document.getElementById("logBox");
            const time = new Date().toLocaleTimeString();

            const p = document.createElement("p");
            p.textContent = `[${time}] ${text}`;
            box.appendChild(p);

            // Giữ tối đa 50 dòng
            if (box.children.length > 50) {
                box.removeChild(box.firstChild);
            }

            box.scrollTop = box.scrollHeight;
        }

        // 1 request
        function attackOnce() {
            addLog("Đã gửi request");
            sendRequestFlood();
        }

        // Flood liên tục
        function attackLoop() {
            if (interval) return;
            addLog("Bắt đầu flood...");
            interval = setInterval(async () => {
                try {
                    await sendRequestFlood();
                    addLog("Đã gửi request");
                } catch {
                    clearInterval(interval);
                    interval = null;
                    addLog("Đã bị block - dừng flood");
                }
            }, 1000);
        }

        // Dừng
        function stopAttack() {
            clearInterval(interval);
            interval = null;
            addLog("Đã dừng flood");
        }

        // Check block
        setInterval(async () => {
            const data = await checkBlock();
            if (data.blocked) {
                window.location.href = "403.html";
            }
        }, 1000);
    </script>
    <script src="js/api.js"></script>
</body>

</html>
